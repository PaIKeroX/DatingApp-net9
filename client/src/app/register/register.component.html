<form [formGroup]="registerForm" (ngSubmit)="register()" autocomplete="off" class="mt-3">
    <h2 class="tex-center text-primary">Sign up</h2>

    <div class="mb-3">
        <label style="margin-right: 10px;">I am a: </label>
        <label class="form-check-label">
            <input type="radio" class="form-check-input" value="male" formControlName="gender"> Male
        </label>
        <label class="form-check-label">
            <input type="radio" class="form-check-input" value="female" formControlName="gender"> Female
        </label>
    </div>

    <app-text-input [formControl]="$any(registerForm.controls['username'])" 
        [label]="'Username'">
    </app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['knownAs'])" 
        [label]="'Known as'">
    </app-text-input>

    <app-date-picker [formControl]="$any(registerForm.controls['dateOfBirth'])" 
        [label]="'Date of birth'" [maxDate]="maxDate">
    </app-date-picker>

    <app-text-input [formControl]="$any(registerForm.controls['city'])" 
        [label]="'City'">
    </app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['country'])" 
        [label]="'Country'">
    </app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['password'])" 
        [label]="'Password'"
        [type]="'password'">
    </app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['confirmPassword'])" 
        [label]="'Confirm password'"
        [type]="'password'">
    </app-text-input>

    @if (validationErrors) {
        <div class="alert alert-danger text-start">
            <ul>
                @for (error of validationErrors; track $index) {
                    <li>{{error}}</li>
                }
            </ul>
        </div>
    }

    <div class="text-center">
        <button [disabled]="!registerForm.valid" class="btn btn-success me-2 px-4" type="submit">
            <i class="fa fa-user-plus me-1"></i>
            Register
        </button>
        <button class="btn btn-secondary px-4" type="button" (click)="cancel()">
            <i class="fa fa-ban me-1"></i>
            Cancel
        </button>
    </div>
</form>
